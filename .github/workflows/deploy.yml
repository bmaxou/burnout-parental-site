name: Deploiement automatique OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploiement FTP vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /burnout-parental/
          exclude: |
            **/.git*
            **/.git*/**
            _build/**
            indexnow.py

      - name: Prevenir Bing des pages nouvelles ou modifiees (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_HOST: burnout-parental.fr
          INDEXNOW_KEY: 42601ece825d2b26eb47bf31e964a945
          BEFORE: ${{ github.event.before }}
        run: python3 indexnow.py
